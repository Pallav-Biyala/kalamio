# ── DNS resolver for proxying to Cloud Run backends ──
resolver 8.8.8.8 8.8.4.4 valid=30s;

# ── Social-unfurl crawler detection (by User-Agent) ──
# These bots don't run JS, so they can't see the SPA's runtime OG tags. Requests
# from them to shareable routes are proxied to the API's /prerender endpoint.
map $http_user_agent $is_crawler {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Slack-ImgProxy|WhatsApp|TelegramBot|Discordbot|Pinterest|redditbot|Applebot|vkShare|Embedly|Iframely|SkypeUriPreview|Google-InspectionTool|Bitrix|nuzzel|Quora|outbrain|W3C_Validator)" 1;
}

# ── 301 redirect: www → non-www ──
server {
    listen 8080;
    server_name www.kalamio.com;

    return 301 https://kalamio.com$request_uri;
}

# ── Dev environment (password protected) ──
server {
    listen 8080;
    server_name dev.kalamio.com;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Kalamio Dev";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2 font/woff application/font-woff2;
    gzip_min_length 256;

    # Hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — no cache so new deploys are picked up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Reverse proxy /api to dev backend (no auth_basic for API calls)
    location /api/ {
        auth_basic off;
        set $dev_backend "https://kalamio-api-development-770359912258.us-central1.run.app";
        proxy_pass $dev_backend;
        proxy_set_header Host kalamio-api-development-770359912258.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Reverse proxy /socket.io to dev backend (WebSocket support)
    location /socket.io/ {
        auth_basic off;
        set $dev_backend "https://kalamio-api-development-770359912258.us-central1.run.app";
        proxy_pass $dev_backend;
        proxy_set_header Host kalamio-api-development-770359912258.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Known SPA routes — serve index.html with 200 ──
    location ~ ^/(editor|dashboard|settings|signin|signup|search|user|publication|messages|blog|auth|verify-otp|forgot-password|reset-password)(/|$) {
        try_files $uri /index.html;
    }

    # Homepage
    location = / {
        try_files /index.html =404;
    }

    # Everything else — serve index.html but with 404 status (fixes soft-404 for SEO)
    # Crawlers (Googlebot) see HTTP 404; the SPA still renders the 404 UI.
    location / {
        try_files $uri $uri/ =404;
        error_page 404 =404 /index.html;
        add_header X-Robots-Tag "noindex" always;
    }
}

# ── Production (public) ──
server {
    listen 8080;
    server_name kalamio.com;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2 font/woff application/font-woff2;
    gzip_min_length 256;

    # Hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — no cache so new deploys are picked up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── Social crawlers on shareable routes → server-rendered OG tags ──
    # Humans still get the SPA (try_files); bots are handed to @prerender.
    # `return 470` inside `if` is one of the two nginx-safe uses of `if`.
    location ~ ^/(blog|user|publication)(/|$) {
        error_page 470 = @prerender;
        recursive_error_pages on;
        if ($is_crawler) { return 470; }
        try_files $uri /index.html;
    }

    # Internal: proxy the original path to the API prerender endpoint.
    location @prerender {
        set $prerender_target "https://kalamio-api-770359912258.us-central1.run.app/api/v1/prerender$request_uri";
        proxy_pass $prerender_target;
        proxy_set_header Host kalamio-api-770359912258.us-central1.run.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # Dynamic sitemap → API (the URL advertised in robots.txt).
    location = /sitemap.xml {
        set $sitemap_target "https://kalamio-api-770359912258.us-central1.run.app/api/v1/sitemap.xml";
        proxy_pass $sitemap_target;
        proxy_set_header Host kalamio-api-770359912258.us-central1.run.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # Reverse proxy /api to production backend
    location /api/ {
        set $prod_backend "https://kalamio-api-770359912258.us-central1.run.app";
        proxy_pass $prod_backend;
        proxy_set_header Host kalamio-api-770359912258.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Reverse proxy /socket.io to production backend (WebSocket support)
    location /socket.io/ {
        set $prod_backend "https://kalamio-api-770359912258.us-central1.run.app";
        proxy_pass $prod_backend;
        proxy_set_header Host kalamio-api-770359912258.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Known SPA routes — serve index.html with 200 ──
    location ~ ^/(editor|dashboard|settings|signin|signup|search|user|publication|messages|blog|auth|verify-otp|forgot-password|reset-password)(/|$) {
        try_files $uri /index.html;
    }

    # Homepage
    location = / {
        try_files /index.html =404;
    }

    # Everything else — serve index.html but with 404 status (fixes soft-404 for SEO)
    # Crawlers (Googlebot) see HTTP 404; the SPA still renders the 404 UI.
    location / {
        try_files $uri $uri/ =404;
        error_page 404 =404 /index.html;
        add_header X-Robots-Tag "noindex" always;
    }
}

# ── Catch-all fallback (raw Cloud Run URLs, health checks) ──
server {
