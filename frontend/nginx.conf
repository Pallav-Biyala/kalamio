# ── DNS resolver for proxying to Cloud Run backends ──
resolver 8.8.8.8 8.8.4.4 valid=30s;

# ── 301 redirect: www → non-www ──
server {
    listen 8080;
    server_name www.kalamio.com;

    return 301 https://kalamio.com$request_uri;
}

# ── Dev environment (password protected) ──
server {
    listen 8080;
    server_name dev.kalamio.com;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Kalamio Dev";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/woff2 font/woff application/font-woff2;
    gzip_min_length 256;

    # Hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML — no cache so new deploys are picked up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Reverse proxy /api to dev backend (no auth_basic for API calls)
    location /api/ {
        auth_basic off;
        set $dev_backend "https://kalamio-api-development-770359912258.us-central1.run.app";
        proxy_pass $dev_backend;
        proxy_set_header Host kalamio-api-development-770359912258.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Production (public) ──
