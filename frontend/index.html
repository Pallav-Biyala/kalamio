<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="description" content="Kalamio is the publishing platform for every voice on earth. Write your ideas, publish your story, reach readers who care" />
    <meta name="keywords" content="blog, writing, stories, articles, editor" />
    <meta name="theme-color" content="#1F1F1E" />
    <link rel="canonical" href="https://kalamio.com" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
        font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
        img-src 'self' data: blob: https://*.amazonaws.com https://lh3.googleusercontent.com https://api.dicebear.com;
        connect-src 'self' http://localhost:* ws://localhost:* https://kalamio.com https://dev.kalamio.com https://*.run.app wss://*.run.app;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
    " />
    <title>Kalamio</title>

    <!-- Splash screen styles — in <head> so they survive React mounting -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1f1f1e;
      }
      #splash-logo {
        width: 56px;
        height: 56px;
        object-fit: contain;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.06); }
      }
    </style>

    <!-- Block search engines on dev environment -->
    <script>
      if (window.location.hostname === 'dev.kalamio.com') {
        var meta = document.createElement('meta');
        meta.name = 'robots';
        meta.content = 'noindex, nofollow';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }
      // Apply saved theme to <html> before first paint so splash bg matches
      (function() {
        try {
          var t = JSON.parse(sessionStorage.getItem('theme') || '""');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" role="application" aria-label="Kalamio">
      <!-- Splash — shown instantly, replaced when React mounts -->
      <div id="splash" aria-hidden="true">
        <img src="/splash-logo.png" alt="" width="56" height="56" id="splash-logo" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
