<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/imgs/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="description" content="Kalamio is the publishing platform for every voice on earth. Write your ideas, publish your story, reach readers who care" />
    <meta name="keywords" content="blog, writing, stories, articles, editor" />
    <meta name="theme-color" content="#1F1F1E" />
    <link rel="canonical" href="https://kalamio.com" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
        font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
        img-src 'self' data: blob: https://*.amazonaws.com https://lh3.googleusercontent.com;
        connect-src 'self' https://kalamio.com https://dev.kalamio.com https://*.run.app wss://*.run.app;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
    " />
    <title>Kalamio</title>

    <!-- Block search engines on dev environment -->
    <script>
      if (window.location.hostname === 'dev.kalamio.com') {
        var meta = document.createElement('meta');
        meta.name = 'robots';
        meta.content = 'noindex, nofollow';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content" aria-label="Skip to main content">Skip to content</a>
    <div id="root" role="application" aria-label="Kalamio"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
