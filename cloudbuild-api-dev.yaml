steps:
  # Step 1: Install dependencies and run security audit
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd server && npm ci --omit=dev && npm audit --audit-level=critical --omit=dev && echo "✅ Dependencies OK"'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA',
        '-f',
        'server/Dockerfile',
        'server'
      ]

  # Step 3: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA'
      ]

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'kalamio-api-development',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        # Redis (response caching) is wired from Secret Manager on every deploy.
        # --update-secrets REPLACES the earlier --clear-secrets, so the refs are
        # re-applied each deploy instead of stripped. Secrets must exist with values.
        # All three wired: Redis caching + Cloudflare origin-lock. Verified live —
        # dev.kalamio.com passes with CF's X-Origin-Secret header; direct *.run.app → 403.
        '--update-secrets',
        'UPSTASH_REDIS_REST_URL=upstash-redis-rest-url-dev:latest,UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token-dev:latest,CLOUDFLARE_ORIGIN_SECRET=cloudflare-origin-secret-dev:latest',
        # Prerender OG/Twitter images route through the image CDN (cdn.kalamio.com).
        '--update-env-vars',
        'CDN_DOMAIN=https://cdn.kalamio.com'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
