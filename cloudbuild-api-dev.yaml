steps:
  # Step 1: Install dependencies and run security audit
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd server && npm ci --omit=dev && npm audit --audit-level=critical --omit=dev && echo "✅ Dependencies OK"'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA',
        '-f',
        'server/Dockerfile',
        'server'
      ]

  # Step 3: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA'
      ]

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'kalamio-api-development',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
