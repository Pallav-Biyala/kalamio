steps:
  # Step 1: Install dependencies and run security audit
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd server && npm ci --omit=dev && npm audit --audit-level=critical --omit=dev && echo "✅ Dependencies OK"'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA',
        '-f',
        'server/Dockerfile',
        'server'
      ]

  # Step 3: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA'
      ]

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'kalamio-api',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated'
        # UPSTASH_REDIS_REST_* and CLOUDFLARE_ORIGIN_SECRET are intentionally NOT
        # wired here: they're opt-in in the app (caching + origin-lock no-op when
        # unset), so the deploy must not hard-depend on the secrets existing. To turn
        # them on, create the prod secrets in Secret Manager, then bind them ONCE:
        #   gcloud run services update kalamio-api --region us-central1 \
        #     --update-secrets UPSTASH_REDIS_REST_URL=upstash-redis-rest-url:latest,UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token:latest,CLOUDFLARE_ORIGIN_SECRET=cloudflare-origin-secret:latest
        # Later `run deploy` calls preserve the binding (a revision inherits prior config).
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
