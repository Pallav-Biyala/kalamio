steps:
  # Step 1: Install dependencies and run security audit
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd server && npm ci --omit=dev && npm audit --audit-level=critical --omit=dev && echo "✅ Dependencies OK"'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA',
        '-f',
        'server/Dockerfile',
        'server'
      ]

  # Step 3: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA'
      ]

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'kalamio-api',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        # A prior failed deploy (the redis/cloudflare commit) baked these secret refs
        # into the service's revision template. `run deploy` INHERITS that template, so
        # merely omitting --update-secrets isn't enough — the refs carry forward and the
        # deploy keeps failing on the (disabled) Secret Manager API. --clear-secrets
        # strips ALL secret-backed env vars, giving a revision with no Secret Manager
        # dependency. Nothing here needs secrets: caching + origin-lock are opt-in and
        # no-op when unset. Harmless no-op once the template is clean.
        # To enable Redis/Cloudflare later: create the prod secrets in Secret Manager and
        # swap this flag for:
        #   --update-secrets UPSTASH_REDIS_REST_URL=upstash-redis-rest-url:latest,UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token:latest,CLOUDFLARE_ORIGIN_SECRET=cloudflare-origin-secret:latest
        '--clear-secrets'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
