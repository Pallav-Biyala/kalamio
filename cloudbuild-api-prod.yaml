steps:
  # Step 1: Install dependencies and run security audit
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd server && npm ci --omit=dev && npm audit --audit-level=critical --omit=dev && echo "✅ Dependencies OK"'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA',
        '-f',
        'server/Dockerfile',
        'server'
      ]

  # Step 3: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA'
      ]

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'kalamio-api',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        # Cache + Cloudflare-origin-lock creds from Secret Manager. --update-secrets
        # MERGES, so existing env/secrets on the service (DB, JWT, AWS…) are preserved.
        # Prereq: create these secrets first (see repo README / deploy notes).
        '--update-secrets',
        'UPSTASH_REDIS_REST_URL=upstash-redis-rest-url:latest,UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token:latest,CLOUDFLARE_ORIGIN_SECRET=cloudflare-origin-secret:latest'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
