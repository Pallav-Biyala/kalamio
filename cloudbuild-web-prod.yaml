steps:
  # Step 1: Build Docker image (uses $COMMIT_SHA for traceability)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',

        '--build-arg', 'VITE_SERVER_DOMAIN=https://kalamio.com/',

        # Image CDN — CloudFront-cached S3, served via cdn.kalamio.com.
        '--build-arg', 'VITE_CDN_DOMAIN=https://cdn.kalamio.com',

        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend:$COMMIT_SHA',

        './frontend'
      ]

  # Step 2: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend:$COMMIT_SHA'
      ]

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'kalamio-web',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
